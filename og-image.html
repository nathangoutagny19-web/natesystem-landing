<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
 *{margin:0;padding:0;box-sizing:border-box}
 body{width:1200px;height:630px;background:#0a0a0c;overflow:hidden;position:relative;
      font-family:'DM Sans',-apple-system,sans-serif}
 .grid{position:absolute;inset:0;opacity:.5;
   background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
   background-size:60px 60px}
 .glow{position:absolute;right:-180px;top:50%;transform:translateY(-50%);width:900px;height:900px;border-radius:50%;
   background:radial-gradient(circle,rgba(230,57,70,.22) 0%,rgba(230,57,70,.07) 42%,transparent 70%)}
 .logo{position:absolute;left:80px;top:78px;display:flex;align-items:center;gap:14px;z-index:2}
 .logo .mark{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:34px;color:#fff}
 .logo .mark i{color:#E63946;font-style:normal}
 .logo .name{font-size:23px;font-weight:500;color:#fff;letter-spacing:-.2px}
 .place{position:absolute;right:80px;top:86px;z-index:2;font-family:'JetBrains Mono',monospace;
   font-size:13px;letter-spacing:3px;text-transform:uppercase;color:#E63946}
 .h{position:absolute;left:80px;top:214px;z-index:2;width:1010px;
   font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:72px;line-height:1.18;
   color:#fff;letter-spacing:-.5px}
 .h .a{color:#E63946}
 .strip{position:absolute;left:80px;bottom:74px;z-index:2;font-family:'JetBrains Mono',monospace;
   font-size:14px;letter-spacing:1.3px;color:#8d8d98}
 .strip b{color:#E63946;font-weight:500}
 .strip span{color:#4d4d55;margin:0 10px}
 .url{position:absolute;right:80px;bottom:74px;z-index:2;font-family:'JetBrains Mono',monospace;
   font-size:14px;letter-spacing:2.6px;text-transform:uppercase;color:#5f5f6a}
</style></head><body>
 <div class="grid"></div><div class="glow"></div>
 <div class="logo"><span class="mark">N<i>.</i></span><span class="name">NateSystem</span></div>
 <div class="place">Lyon &middot; France</div>
 <div class="h">Your scattered data becomes<br><span class="a">your firm&rsquo;s biggest asset.</span></div>
 <div class="strip">Custom AI &amp; software <span>&middot;</span> Built on your process <span>&middot;</span> <b>You own it</b></div>
 <div class="url">natesystem.com</div>
</body></html>

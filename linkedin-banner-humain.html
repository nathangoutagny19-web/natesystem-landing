<meta charset="utf-8" />
<title>LinkedIn cover, the people</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* ────────────────────────────────────────────────────────────────────
     BANDEAU LINKEDIN N°2 — 1584 × 396, les gens.

     Le premier bandeau montre le produit. Celui-ci montre qui est en face :
     trois rencontres, trois villes. C'est l'autre moitié de l'argument, et
     c'est celle qu'un chef d'établissement prudent regarde en premier.

     MÊME GÉOMÉTRIE QUE LE PREMIER, et pour la même raison : la photo de
     profil couvre environ x 50→370 et les 130 derniers pixels de hauteur.
     Le bas-gauche reste donc vide, la signature occupe le coin haut-gauche
     qui, lui, reste visible, et le contenu vit à droite de x=452.

     Les photos ne portent AUCUN nom, seulement des villes. Zoltán et
     Catherine ont donné leur accord pour le site ; pour la troisième
     personne rien n'est tracé, et un bandeau est un usage plus personnel
     qu'une page de cas. Les villes disent la même chose sans engager
     personne : il se déplace, il serre des mains.

     Charte : app/globals.css. Rouge #E63946, Instrument Serif italique pour
     le titre, DM Sans pour le corps, JetBrains Mono pour les étiquettes.
     ──────────────────────────────────────────────────────────────────── */

  :root {
    --ivory: #faf8f4;
    --accent: #e63946;
    --text: #1a1a1a;
    --secondary: #5b6472;
    --grid: rgba(15, 23, 42, 0.04);
    --border: rgba(15, 23, 42, 0.10);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1584px; height: 396px; overflow: hidden;
    background: var(--ivory); font-family: 'DM Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .cover { position: relative; width: 1584px; height: 396px; background: var(--ivory); overflow: hidden; }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 56px 56px;
  }
  .glow {
    position: absolute; top: -240px; right: -120px;
    width: 820px; height: 600px;
    background: radial-gradient(ellipse, rgba(230, 57, 70, 0.14) 0%, transparent 68%);
    filter: blur(70px);
  }

  .mark { position: absolute; left: 64px; top: 44px; display: flex; align-items: center; }
  .mark-n {
    font-family: 'Instrument Serif', Georgia, serif; font-style: italic;
    font-size: 34px; color: var(--text); line-height: 1;
  }
  .mark-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
    margin-left: 1px; margin-top: 14px;
  }
  .mark-word {
    font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500;
    letter-spacing: 4.5px; color: var(--text); margin-left: 12px;
  }

  .copy { position: absolute; left: 452px; width: 430px; top: 50%; transform: translateY(-50%); }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 600;
    letter-spacing: 3px; text-transform: uppercase; color: var(--accent);
    margin-bottom: 15px;
  }
  h1 {
    font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-weight: 400;
    font-size: 41px; line-height: 1.16; color: var(--text);
    letter-spacing: -0.3px; margin-bottom: 20px;
  }
  h1 .accent { color: var(--accent); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; max-width: 420px; }
  .chip {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500;
    letter-spacing: 0.4px; color: var(--secondary);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 13px; background: rgba(255, 255, 255, 0.76);
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .chip i { width: 4.5px; height: 4.5px; border-radius: 50%; background: var(--accent); opacity: .85; }

  /* Les trois rencontres, posées comme des tirages sur un bureau. */
  .shots { position: absolute; right: 22px; top: 50%; transform: translateY(-50%);
           width: 700px; height: 300px; }
  .shot {
    position: absolute; width: 226px; height: 151px;
    border-radius: 10px; overflow: hidden;
    border: 5px solid #fff;
    box-shadow: 0 18px 40px -16px rgba(15, 23, 42, .34), 0 2px 6px rgba(15, 23, 42, .10);
    background: #e2e8f0;
  }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .s1 { left: 0;   top: 70px; transform: rotate(-3.4deg); }
  .s2 { left: 238px; top: 66px; transform: rotate(2.2deg);  }
  .s3 { left: 476px; top: 72px; transform: rotate(-1.8deg); }
</style>
</head>

<style>
  /* ────────────────────────────────────────────────────────────────────
     BANNIERE LINKEDIN N.2 — 1584 x 396. Celle de la maison.
     La n.1, celle des ecoles, ne bouge pas.

     TROIS CHANGEMENTS DEMANDES PAR NATHAN SUR LA VERSION PRECEDENTE :
       1. Les trois puces du bas sautent.
       2. La pastille noire « DM me -> SYSTEM » saute aussi. A sa place,
          le N du logo, EN FILIGRANE DANS LE FOND. Il ne se lit pas comme
          une signature posee dessus mais comme une marque imprimee dans
          le papier : Instrument Serif italique, 6 % d'encre, le point
          rouge a 11 %.
       3. Un globe en fil de fer dans le fond, sous les photos. C'est lui
          qui porte « internationally » maintenant que les puces sont
          parties.

     LE GLOBE EST CONSTRUIT, PAS DESSINE A LA MAIN. Projection
     orthographique : un parallele a la latitude p devient une ellipse
     horizontale centree en y = C - R sin(p), de demi-largeur R cos(p) ;
     un meridien a l'angle a devient une ellipse verticale de
     demi-largeur R |cos(a)|.

     Nathan a d'abord demande « plus transparent mais plus realiste »,
     puis a precise : « quand je dis tres realiste c'est vraiment
     realiste ». Une maille seule ne suffisait pas, il fallait des
     continents. Ils ne sont ni dessines ni inventes : ce sont les
     cotes reelles.

     D'OU VIENT LA CARTE. Natural Earth, domaine public, recuperee en
     TopoJSON. Les arcs y sont quantifies et encodes en deltas : on
     cumule, on applique scale et translate, et on obtient des longitudes
     et des latitudes. Un indice d'arc negatif i designe l'arc ~i
     parcouru a l'envers.

     ⚠︎ C'EST LE JEU 50m, PAS LE 110m. Le 110m (5 123 points) suffisait
     tant que la sphere faisait 660 points de large. A 3 300, soit cinq
     fois plus, ses sommets espaces d'environ un degre devenaient
     visibles un par un : la cote lisait comme une ligne brisee. Nathan
     l'a vu en zoomant. Le 50m en porte 60 635 et la cote redevient une
     courbe.

     ⚠︎ ET ON N'EN GARDE QUE CE QUI SE VOIT. Sur la banniere, seules 25
     unites du viewBox sur 660 sont visibles. Garder l'hemisphere entier
     mettrait 60 000 points dans le fichier pour en afficher quelques
     centaines. Les traces sont donc coupes a y = 48 : 150 traces,
     5 788 points, 73 Ko au lieu de plusieurs megaoctets.

     LA PROJECTION EST FAITE A LA MAIN, orthographique, centree a 15
     degres Est et latitude 0 :
       cos c = sin(f0) sin(f) + cos(f0) cos(f) cos(l - l0)
       visible si cos c > 0
       x = CX + R cos(f) sin(l - l0)
       y = CY - R ( cos(f0) sin(f) - sin(f0) cos(f) cos(l - l0) )
     Le centre est choisi pour la banniere : seule la calotte haute du
     disque est visible, donc la latitude 24 N a 90 N le long du
     meridien central, ou tombent l'Europe, l'Atlantique nord et l'Asie.

     LE DECOUPAGE AU LIMBE. Chaque anneau est densifie a 1,4 degre, puis
     coupe des qu'il passe sur la face cachee. Le point de sortie exact
     est trouve par bissection, 18 iterations : les cotes s'arretent pile
     sur le cercle au lieu de baver dessus. 57 traces en sortie.

     LE RESTE : maille tous les 15 degres, trait a 0,85, encre a 5,5 %,
     et un degrade radial decentre vers le haut a gauche pour le volume.
     Les trois points rouges ont ete retires a la demande de Nathan.

     CE QUI VIENT DE MELYO, et qui reste : la structure verticale qui
     remplit le cadre, la preuve visuelle en premier, le curseur pose sur
     l'element cliquable. Ce qui n'en vient pas : leur pile de visages
     s'accompagne toujours d'une note et d'un volume, « +102 Fondateurs,
     Note 5/5 ». NateSystem n'a ni l'un ni l'autre et l'eliminateur n.1
     interdit d'en inventer un. La preuve reste qualitative.

     ⚠︎ LE MOT « AGENCY » NE SERA JAMAIS ECRIT. Nathan l'a demande deux
     fois. Eliminateur n.3 de knowledge/voix/garde-fous-publication.md,
     regle qu'il a posee lui-meme : la categorie « agence » se juge sur
     des metriques de resultat commercial, ce que l'eliminateur n.2
     interdit de promettre. L'idee est gardee, le mot saute.

     ⚠︎ LA TUILE DE FOND EST DECOUPEE DANS LA BANNIERE 1, pas imitee :
     120x120 prise en (2880,600) de linkedin-banner-ecoles-live@2x.png.
     Meme papier, meme grille tous les 60 points.

     GEOMETRIE : la photo de profil couvre x 47 -> 367 et les 190
     derniers pixels.
     ──────────────────────────────────────────────────────────────────── */

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1584px; height: 396px; overflow: hidden;
         font-family: 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased; }

  .cover { position: relative; width: 1584px; height: 396px; overflow: hidden;
           background: #f5f5f0 url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAHgAAAB4CAYAAAA5ZDbSAAAACXBIWXMAAAAAAAAAAQCEeRdzAAABPklEQVR4nO3TwQmAMAAEQYV8Yv/1+Ugj6scSRFhmKjhYbl/rvLbHnHOjZ/w9gG+N97nH4cFFHhwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRx3AxFhBdJmYqEGAAAAAElFTkSuQmCC') repeat 0 0 / 60px 60px; }

  /* Le N, imprime dans le papier. */
  .watermark { position: absolute; left: 52px; top: 4px;
               font-family: 'Instrument Serif', Georgia, serif; font-style: italic;
               font-size: 250px; line-height: 1; color: rgba(20,20,20,0.060);
               user-select: none; }
  .watermark i { font-style: normal; color: rgba(230,57,70,0.11); }

  /* Le globe, derriere tout, centre sous les photos. */
  /* ⚠︎ PLUS BAS ET PLUS LARGE, ET LES DEUX SE CONTREDISENT.
     La corde visible d'une calotte vaut 2 racine(2 R h - h carre), ou h
     est la hauteur visible. Descendre la sphere, c'est reduire h, donc
     retrecir la corde : les deux demandes tirent en sens inverse. Le
     seul levier qui les reconcilie est le rayon.

     ETAT ACTUEL : l'arc passe PILE PAR LES DEUX COINS DU BAS. Nathan
     voulait qu'il soit « plus rond dans le corner en bas a droite » : il
     s'arretait a x = 1514 et laissait 70 points de vide. Ca se resout,
     ca ne se tatonne pas. En posant h = 396 - sommet et la demi-corde
     a 554 (la moitie des 1 584 de large, depuis le centre a 1 030) :
         h = R - racine(R carre - 554 carre)
     Pour que l'arc sorte exactement par le coin, R = (306 916 + k carre)
     / (-2k) avec k = sommet - 396. Sommet a 285 donne R = 1 438, soit
     une sphere de 2 966 points, et une fleche de 111 au lieu de 75.

     ⚠︎ CA REMONTE LE SOMMET DE 36 POINTS, et c'est inevitable : a
     sommet egal, un rayon plus petit est plus courbe donc redescend
     PLUS TOT et vide le coin encore plus. Remplir le coin et baisser
     l'arc tirent en sens inverse.

     Troisieme consequence, la moins evidente : plus la calotte est
     mince, plus la bande visible se rapproche du pole. Ici elle couvre
     72,3 a 90 degres depuis le centre de projection, soit 18 degres de
     latitude seulement. A centre inchange l'Europe serait sortie par le
     haut. Le centre descend donc a 28 degres SUD, ce qui ramene la bande
     a 44,3 N - 62 N : la France, les Alpes, les Iles Britanniques et le
     sud de la Scandinavie.

     ⚠︎ LES TRAITS NE DOIVENT PAS GROSSIR AVEC LA SPHERE. A cette
     echelle le facteur est de 5 : la maille deviendrait un grillage.
     vector-effect garde chaque trait a son epaisseur d'ecran. */
  .globe { position: absolute; left: 1030px; top: 240px;
           width: 2966px; height: 2966px; transform: translateX(-50%);
           color: rgba(15,23,42,0.038); }
  .globe ellipse, .globe circle, .globe path { vector-effect: non-scaling-stroke; }

  .stack { position: absolute; left: 1030px; top: 50%; transform: translate(-50%, -50%);
           display: flex; flex-direction: column; align-items: center; }

  /* La preuve, en haut. */
  .shots { display: flex; gap: 22px; }
  .card { position: relative; width: 212px; height: 150px; border-radius: 14px; }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 14px;
              filter: saturate(0.93) contrast(1.02);
              box-shadow: 0 10px 24px -8px rgba(15,23,42,.30), 0 1px 3px rgba(15,23,42,.07); }
  .tag { position: absolute; left: 10px; bottom: 10px;
         display: inline-flex; align-items: center; gap: 5px;
         background: #fff; border-radius: 8px; padding: 5px 9px 5px 7px;
         font-size: 11.5px; font-weight: 500; color: var(--text); white-space: nowrap;
         box-shadow: 0 2px 6px rgba(15,23,42,.18); }

  .card.vide { border: 1.6px dashed rgba(230,57,70,.42); background: rgba(230,57,70,.032);
               display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .card.vide > svg { width: 20px; height: 20px; color: var(--accent); opacity: .85; }
  .card.vide span { font-size: 15px; font-weight: 500; color: var(--accent); }
  /* Le curseur deborde de la carte, et c'est ce debord qui donne la
     profondeur. */
  .cur { position: absolute; right: -11px; bottom: -13px; width: 30px; height: 30px; }

  h1 { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-weight: 400;
       font-size: 46px; line-height: 1.2; color: var(--text); letter-spacing: -0.2px;
       white-space: nowrap; margin: 34px 0 0; }
  h1 .accent { color: var(--accent); }
</style>

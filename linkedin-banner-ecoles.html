<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>LinkedIn cover, private schools</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* ────────────────────────────────────────────────────────────────────
     BANDEAU LINKEDIN — 1584 × 396, taille native du profil personnel.

     Même contenu que le bandeau précédent de Nathan : un mockup produit, la
     promesse, quatre bénéfices. Ce qui change, c'est la géométrie.

     Mesuré sur son profil : la photo couvre environ x 50→370 et les 130
     derniers pixels de hauteur. L'ancien bandeau posait le mockup pile là,
     donc à moitié mangé, et centrait le texte, qui se faisait couper sur
     mobile. Ici le mockup passe à DROITE, où il est entièrement visible, le
     texte occupe le centre, et le bas-gauche reste vide.

     Le coin haut-gauche, lui, reste visible au-dessus de la photo : il porte
     la signature.

     Charte : app/globals.css. Rouge #E63946, Instrument Serif italique pour
     le titre, DM Sans pour le corps, JetBrains Mono pour les étiquettes.
     ──────────────────────────────────────────────────────────────────── */

  :root {
    --ivory: #faf8f4;
    --accent: #e63946;
    --text: #1a1a1a;
    --secondary: #5b6472;
    --grid: rgba(15, 23, 42, 0.04);
    --border: rgba(15, 23, 42, 0.10);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1584px; height: 396px; overflow: hidden;
    background: var(--ivory);
    font-family: 'DM Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .cover { position: relative; width: 1584px; height: 396px; background: var(--ivory); overflow: hidden; }

  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 56px 56px;
  }
  .glow {
    position: absolute; top: -240px; right: -120px;
    width: 820px; height: 600px;
    background: radial-gradient(ellipse, rgba(230, 57, 70, 0.14) 0%, transparent 68%);
    filter: blur(70px);
  }

  /* Signature, en haut à gauche, au-dessus de la photo de profil. */
  .mark { position: absolute; left: 64px; top: 44px; display: flex; align-items: center; }
  .mark-n {
    font-family: 'Instrument Serif', Georgia, serif; font-style: italic;
    font-size: 34px; color: var(--text); line-height: 1;
  }
  .mark-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
    margin-left: 1px; margin-top: 14px;
  }
  .mark-word {
    font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500;
    letter-spacing: 4.5px; color: var(--text); margin-left: 12px;
  }

  /* Le message, à droite de la photo, centré verticalement. */
  .copy { position: absolute; left: 452px; width: 600px; top: 50%; transform: translateY(-50%); }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 600;
    letter-spacing: 3px; text-transform: uppercase; color: var(--accent);
    margin-bottom: 15px;
  }

  h1 {
    font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-weight: 400;
    font-size: 41px; line-height: 1.16; color: var(--text);
    letter-spacing: -0.3px; margin-bottom: 20px;
  }
  h1 .accent { color: var(--accent); }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; max-width: 560px; }
  .chip {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500;
    letter-spacing: 0.4px; color: var(--secondary);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 13px; background: rgba(255, 255, 255, 0.76);
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .chip i { width: 4.5px; height: 4.5px; border-radius: 50%; background: var(--accent); opacity: .85; }

  /* Le mockup : à droite, légèrement incliné, il déborde du cadre. */
  .shot {
    position: absolute;
    right: -78px; top: 50%;
    width: 640px; height: 296px;
    transform: translateY(-50%) perspective(1400px) rotateY(-13deg) rotateX(2deg);
    border-radius: 12px; overflow: hidden;
    border: 1px solid rgba(15, 23, 42, 0.10);
    background: #fff;
    box-shadow: 0 30px 70px -28px rgba(15, 23, 42, 0.32);
  }
  .shot-bar {
    height: 24px; background: #f4f6f8;
    border-bottom: 1px solid rgba(15, 23, 42, 0.07);
    display: flex; align-items: center; gap: 5px; padding-left: 12px;
  }
  .shot-bar i { width: 7px; height: 7px; border-radius: 50%; background: rgba(15,23,42,.14); }
  .shot-img {
    width: 100%; height: calc(100% - 24px);
    background: url('public/realisations/mockups/tcrm.webp') top left / cover no-repeat;
  }
  /* Fondu vers l'ivoire sur le bord droit, pour que le mockup ne se coupe pas net. */
  .shot-fade {
    position: absolute; inset: 0;
    background: linear-gradient(100deg, transparent 58%, rgba(250, 248, 244, 0.55) 100%);
  }

  body.debug .avatar-zone {
    position: absolute; left: 30px; bottom: 0; width: 400px; height: 150px;
    outline: 2px dashed rgba(230, 57, 70, .6); background: rgba(230, 57, 70, .07);
  }
  body:not(.debug) .avatar-zone { display: none; }
</style>
</head>
<body>
  <div class="cover">
    <div class="grid"></div>
    <div class="glow"></div>

    <div class="shot">
      <div class="shot-bar"><i></i><i></i><i></i></div>
      <div class="shot-img"></div>
      <div class="shot-fade"></div>
    </div>

    <div class="mark">
      <span class="mark-n">N</span><span class="mark-dot"></span>
      <span class="mark-word">NATESYSTEM</span>
    </div>

    <div class="copy">
      <p class="eyebrow">Private schools &middot; Custom platforms</p>
      <h1>
        Custom platforms that give your school
        administration <span class="accent">30 hours a month</span> back.
      </h1>
      <div class="chips">
        <span class="chip"><i></i>Time back</span>
        <span class="chip"><i></i>Clear processes</span>
        <span class="chip"><i></i>Centralized data</span>
        <span class="chip"><i></i>Peace of mind</span>
      </div>
    </div>

    <div class="avatar-zone"></div>
  </div>

  <script>
    if (location.search.includes('debug')) document.body.classList.add('debug')
  </script>
</body>
</html>

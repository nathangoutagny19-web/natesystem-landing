<title>LinkedIn cover, le mur de logos</title>

<style>
  /* ────────────────────────────────────────────────────────────────────
     BANNIERE LINKEDIN N.3 — 1584 x 396. Le mur de logos.

     ⚠︎ POURQUOI UNE TROISIEME, ET PAS UNE RANGEE DE LOGOS AJOUTEE A LA
     DEUXIEME. La banniere 2 porte deja quatre photos, un titre et un
     globe. Y ajouter huit logos ferait exactement ce que Nathan avait
     refuse sur la banniere ecoles : deux preuves empilees dans un cadre
     qui n'en tient qu'une. Une banniere dont le seul sujet est la preuve
     frappe plus fort, et les trois se permutent.

     ⚠︎ PAS DE WEBM. Partenaire et non client, reserve a la banniere
     Facebook. Decision de Nathan, 4 octobre 2026.

     ⚠︎ SIMPLETEAM EST TRAITE A PART. Son fichier est un trace blanc
     decoupe en alpha : en niveaux de gris il resterait blanc, donc
     invisible. brightness(0) l'aplatit en silhouette, comme sur le site.

     ⚠︎ LE CHIFFRE EST « TREIZE », PAS HUIT. Huit logos, treize
     etablissements : les Chartreux comptent neuf sites. Le texte dit
     donc « etablissements et organisations », jamais « clients », parce
     que « treize clients » serait faux et se verifie en une question.

     GEOMETRIE : la photo de profil couvre x 47 -> 367 et les 190
     derniers pixels. Le bloc est cale a droite de 420.
     ──────────────────────────────────────────────────────────────────── */

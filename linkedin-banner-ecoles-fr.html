<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Couverture LinkedIn, écoles privées</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* ────────────────────────────────────────────────────────────────────
     BANDEAU LINKEDIN — 1584 × 396, la taille native du profil personnel.

     La géométrie commande la composition, pas l'inverse :
       · la photo de profil mord le BAS-GAUCHE du bandeau. Mesuré sur le
         profil de Nathan : le cercle couvre environ x 50→370 et les 130
         derniers pixels de hauteur. Tout ce qui compte reste donc à droite
         de x = 430.
       · LinkedIn recadre plus serré sur mobile. Le bloc de texte est calé
         verticalement au centre, pas collé aux bords.
       · Le coin haut-gauche, lui, reste visible : il porte la signature.

     C'est exactement ce qui clochait sur l'ancien bandeau : le mockup était
     posé à gauche, donc à moitié mangé par la photo, et le texte centré se
     faisait couper sur mobile.

     Charte : app/globals.css. Rouge #E63946, Instrument Serif italique pour
     le titre, DM Sans pour le corps, JetBrains Mono pour les étiquettes.
     ──────────────────────────────────────────────────────────────────── */

  :root {
    --ivory: #faf8f4;
    --accent: #e63946;
    --text: #1a1a1a;
    --secondary: #5b6472;
    --muted: #94a3b8;
    --grid: rgba(15, 23, 42, 0.04);
    --border: rgba(15, 23, 42, 0.10);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1584px;
    height: 396px;
    overflow: hidden;
    background: var(--ivory);
    font-family: 'DM Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .cover {
    position: relative;
    width: 1584px;
    height: 396px;
    background: var(--ivory);
    overflow: hidden;
  }

  /* La grille fine du site, et la nappe rouge diffuse en haut à droite. */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 56px 56px;
  }
  .glow {
    position: absolute;
    top: -220px; right: -160px;
    width: 780px; height: 560px;
    background: radial-gradient(ellipse, rgba(230, 57, 70, 0.13) 0%, transparent 68%);
    filter: blur(70px);
  }

  /* Signature, en haut à gauche : la seule chose posée dans la moitié
     gauche, et assez haute pour passer au-dessus de la photo de profil. */
  .mark {
    position: absolute;
    left: 64px; top: 46px;
    display: flex; align-items: center; gap: 2px;
  }
  .mark-n {
    font-family: 'Instrument Serif', Georgia, serif;
    font-style: italic;
    font-size: 34px;
    color: var(--text);
    line-height: 1;
  }
  .mark-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    margin-left: -1px; margin-top: 14px;
  }
  .mark-word {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px; font-weight: 500;
    letter-spacing: 4.5px;
    color: var(--text);
    margin-left: 12px;
  }

  /* Le bloc de message : centré verticalement, calé à droite de la photo. */
  .copy {
    position: absolute;
    left: 452px; right: 76px;
    top: 50%; transform: translateY(-50%);
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; font-weight: 600;
    letter-spacing: 3.2px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 16px;
  }

  h1 {
    font-family: 'Instrument Serif', Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: 50px;
    line-height: 1.12;
    color: var(--text);
    letter-spacing: -0.4px;
    margin-bottom: 16px;
  }
  h1 .accent { color: var(--accent); }

  .sub {
    font-size: 17px;
    font-weight: 300;
    line-height: 1.55;
    color: var(--secondary);
    max-width: 780px;
    margin-bottom: 22px;
  }
  .sub strong { font-weight: 500; color: var(--text); }

  .chips { display: flex; gap: 10px; flex-wrap: wrap; }
  .chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: 0.6px;
    color: var(--secondary);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 15px;
    background: rgba(255, 255, 255, 0.72);
    display: inline-flex; align-items: center; gap: 7px;
  }
  .chip i {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent); opacity: 0.85;
    display: inline-block;
  }

  /* Zones réservées, visibles seulement avec ?debug dans l'URL. */
  body.debug .avatar-zone {
    position: absolute;
    left: 30px; bottom: 0;
    width: 400px; height: 150px;
    outline: 2px dashed rgba(230, 57, 70, 0.6);
    background: rgba(230, 57, 70, 0.07);
  }
  body:not(.debug) .avatar-zone { display: none; }
</style>
</head>
<body>
  <div class="cover">
    <div class="grid"></div>
    <div class="glow"></div>

    <div class="mark">
      <span class="mark-n">N</span><span class="mark-dot"></span>
      <span class="mark-word">NATESYSTEM</span>
    </div>

    <div class="copy">
      <p class="eyebrow">Écoles privées &middot; Plateformes sur-mesure</p>
      <h1>
        Le logiciel s&rsquo;adapte à votre école.<br />
        <span class="accent">Pas l&rsquo;inverse.</span>
      </h1>
      <p class="sub">
        Construit sur votre calendrier, votre convention collective, vos sites.
        <strong>Le code vous appartient.</strong>
      </p>
      <div class="chips">
        <span class="chip"><i></i>En production en un trimestre</span>
        <span class="chip"><i></i>Zéro réorganisation</span>
        <span class="chip"><i></i>Hébergé en UE &middot; RGPD</span>
      </div>
    </div>

    <div class="avatar-zone"></div>
  </div>

  <script>
    if (location.search.includes('debug')) document.body.classList.add('debug')
  </script>
</body>
</html>

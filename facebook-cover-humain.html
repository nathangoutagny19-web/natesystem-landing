<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Facebook cover, human to human</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* ────────────────────────────────────────────────────────────────────
     COUVERTURE FACEBOOK — 820 x 312, livree en 1640 x 624.

     ⚠︎ CE N'EST PAS LA BANNIERE LINKEDIN REDIMENSIONNEE. LinkedIn fait
     1584 x 396, soit 4:1 ; Facebook fait 820 x 312, soit 2,63:1. Le
     panoramique disparait : la rangee de quatre cartes POSEE A COTE du
     titre ne rentre plus. Ici on empile au lieu d'aligner.

     ⚠︎ LA ZONE SURE EST LE CENTRE. Facebook affiche 820 x 312 sur
     ordinateur et 640 x 360 sur mobile : le mobile ROGNE ENVIRON 90
     POINTS DE CHAQUE COTE. Tout ce qui compte vit donc entre x = 90 et
     x = 730. Les reperes sont traces en ?debug.

     ⚠︎ LA PHOTO DE PROFIL MORD LE COIN BAS-GAUCHE, comme sur LinkedIn.
     Elle fait 170 points et deborde : on laisse x 0 -> 210 libre sous
     y = 190.

     Charte : app/globals.css. Les photos, la tuile de fond et le globe
     sont repris tels quels de linkedin-banner-humain.html, pour que les
     deux reseaux montrent la meme maison.
     ──────────────────────────────────────────────────────────────────── */

  :root { --accent: #e63946; --text: #141414; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 820px; height: 312px; overflow: hidden;
         font-family: 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased; }

  .cover { position: relative; width: 820px; height: 312px; overflow: hidden;
           background: #f5f5f0 url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAHgAAAB4CAYAAAA5ZDbSAAAACXBIWXMAAAAAAAAAAQCEeRdzAAABPklEQVR4nO3TwQmAMAAEQYV8Yv/1+Ugj6scSRFhmKjhYbl/rvLbHnHOjZ/w9gG+N97nH4cFFHhwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRx3AxFhBdJmYqEGAAAAAElFTkSuQmCC') repeat 0 0 / 60px 60px; }

  /* Le N dans le papier, plus petit qu'en 1584 : le cadre est deux fois
     moins large, un filigrane de 250 points l'ecraserait. */
  .watermark { position: absolute; left: 26px; top: -6px;
               font-family: 'Instrument Serif', Georgia, serif; font-style: italic;
               font-size: 132px; line-height: 1; color: rgba(20,20,20,0.060);
               user-select: none; }
  .watermark i { font-style: normal; color: rgba(230,57,70,0.11); }

  /* Agrandi le 4 octobre : depuis que tout le contenu est remonte dans la
     moitie haute pour le telephone, la moitie basse etait vide sur ordinateur.
     Le globe la tient. Il ne coute rien sur mobile, il y est derriere la
     photo de profil et sous le seuil de lecture. */
  .globe { position: absolute; left: 575px; top: 152px;
           width: 410px; height: 410px; color: rgba(15,23,42,0.07); }
  .globe ellipse, .globe circle, .globe path { vector-effect: non-scaling-stroke; }

  /* Le bloc central, cale sur le milieu du cadre et non sur un tiers :
     en 2,63:1, decentrer fait sortir de la zone sure. */
  /* ⚠︎ TOUT VIT DANS LA MOITIE HAUTE, ET C'EST LA VRAIE CONTRAINTE.
     Mesure faite le 4 octobre 2026 sur une capture de l'app Facebook :
     sur mobile la photo de profil n'est PAS en bas a gauche comme sur
     ordinateur, elle est CENTREE. Elle fait 46 % de la largeur et
     commence a 50 % de la hauteur, puis deborde en bas.
     Traduit dans ce fichier : elle masque x 284 a 536 a partir de
     y = 157. Le titre et la bande de logos etaient dessous.
     Donc : photos et titre au-dessus de y = 150, et rien d'essentiel
     plus bas. La bande de logos disparait, il n'y a pas de place ou
     elle serait vue sur telephone.
     ⚠︎ Et la largeur sure reste 555 : Facebook agrandit de 15,4 % pour
     remplir le 640 x 360 du mobile, puis coupe 133 points de chaque
     cote dans le fichier. */
  .stack { position: absolute; left: 410px; top: 13px; transform: translateX(-50%);
           display: flex; flex-direction: column; align-items: center; max-width: 548px; }

  .shots { display: flex; gap: 11px; }
  .card { position: relative; width: 117px; height: 58px; border-radius: 8px; }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 9px;
              filter: saturate(0.93) contrast(1.02);
              box-shadow: 0 7px 16px -6px rgba(15,23,42,.28), 0 1px 2px rgba(15,23,42,.07); }
  .card.vide { border: 1.4px dashed rgba(230,57,70,.42); background: rgba(230,57,70,.032);
               display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .card.vide > svg { width: 14px; height: 14px; color: var(--accent); opacity: .85; }
  .card.vide span { font-size: 11px; font-weight: 500; color: var(--accent); }
  .cur { position: absolute; right: -8px; bottom: -9px; width: 21px; height: 21px; }

  /* ⚠︎ FACEBOOK N'A QU'UNE COUVERTURE. Sur LinkedIn, une banniere vend
     l'offre et l'autre vend la maison. Ici il faut les deux dans le meme
     cadre, et deux fois plus petit : les photos portent l'humain, le
     titre porte l'offre, la ligne du bas porte la cible. Le mockup et le
     bandeau de logos de la banniere ecoles ne rentrent pas, et c'est
     tant mieux : a 820 points de large ils auraient fait de la bouillie. */
  h1 { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-weight: 400;
       font-size: 21px; line-height: 1.2; color: var(--text); letter-spacing: -0.2px;
       text-align: center; margin: 9px 0 0; }
  h1 .accent { color: var(--accent); }
  .cible { font-size: 10px; font-weight: 500; letter-spacing: 2.4px;
           text-transform: uppercase; color: #6b7280; margin-top: 7px; }


  /* ⚠︎ LA BANDE DE LOGOS VIT DANS LE FOND, dans les 56 points qui
     restent sous le bloc. Elle ne remplace rien : la composition
     validee ne bouge pas d'un pixel.

     ⚠︎ ELLE COMMENCE A x=206 ET PAS A 90. La photo de profil Facebook
     mord le coin bas-gauche jusqu'a x=200 : un logo pose avant
     disparaitrait sous elle. Elle s'arrete a 730, bord de la zone sure
     mobile.

     ⚠︎ OPACITE BASSE ET NIVEAUX DE GRIS. C'est un fond, pas une
     deuxieme preuve qui se battrait avec les photos du dessus. */
  .logos-fond { position: absolute; left: 216px; right: 150px; bottom: 11px;
                display: flex; align-items: center; justify-content: space-between; }
  .fl { width: auto; max-width: 96px; object-fit: contain; display: block;
        filter: grayscale(100%); opacity: .70; }
  .fl-white { filter: brightness(0); opacity: .52; }
  .fl-count { font-size: 14px; font-weight: 500; letter-spacing: .2px;
               color: #6b7280; opacity: .78; white-space: nowrap; }


  body.debug .zone { position: absolute; left: 133px; top: 0; width: 554px; height: 312px;
    outline: 2px dashed rgba(230,57,70,.55); }
  body.debug .pp { position: absolute; left: 20px; bottom: -40px; width: 170px; height: 170px;
    border-radius: 50%; outline: 2px dashed rgba(15,23,42,.45); background: rgba(15,23,42,.06); }
  body:not(.debug) .zone, body:not(.debug) .pp { display: none; }
</style>
</head>

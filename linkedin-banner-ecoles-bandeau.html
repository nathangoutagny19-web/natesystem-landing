<title>LinkedIn cover, ecoles, bandeau bas</title>
<style>
  /* ────────────────────────────────────────────────────────────────────
     BANNIERE ECOLES — 1584 x 396, bandeau de confiance en bas.

     ⚠︎ RIEN N'EST RECONSTRUIT. Chaque morceau est DECOUPE au pixel dans
     linkedin-banner-ecoles-live@2x.png, la banniere reellement en ligne :
     le mockup flou, la pastille noire « DM me -> SYSTEM », le titre, la
     rangee de puces, « USED BY », le logo Les Chartreux, le logo IUT, le
     texte « +11 schools & organisations », et jusqu'a la tuile de fond
     qui porte la grille. Aucune police n'est redevinee, aucun logo
     refabrique. Une version precedente avait tente de tout refaire en
     CSS : elle etait fausse et Nathan l'a jetee, a raison.

     COORDONNEES DE DECOUPE, en pixels du fichier @2x :
       mockup     1210x792  en (0,0)        bord droit reel de l'encre 1201
       badge       560x136  en (52,44)
       titre      1493x209  en (1309,289)
       puces      1600x106  en (1263,542)
       USED BY     158x40   en (1505,160)
       Chartreux   145x98   en (1690,130)
       IUT         230x82   en (1893,140)
       +11 ...     470x54   en (2145,158)
       tuile fond  120x120  en (2880,600)   fond #f5f5f0, grille tous les 60
     Tout est divise par deux pour revenir en pixels CSS.

     CE QUI CHANGE PAR RAPPORT A LA VERSION EN LIGNE, et c'est la demande :
       · le bandeau de confiance descend EN BAS, pleine largeur, blanc,
         et les logos s'y repartissent au lieu d'etre serres dans une
         pastille ;
       · les trois rencontres entrent dans ce bandeau, a sa droite ;
       · les puces remontent EN HAUT.

     ⚠︎ LE BANDEAU COMMENCE A x=400. Mesure sur le profil de Nathan, la
     photo de profil couvre x 50->370 et les 130 derniers pixels. Tout ce
     qui serait pose a gauche de 400 dans ce bandeau passerait dessous.
     ──────────────────────────────────────────────────────────────────── */

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1584px; height: 396px; overflow: hidden; }

  .cover {
    position: relative; width: 1584px; height: 396px; overflow: hidden;
    background: #f5f5f0 url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAHgAAAB4CAYAAAA5ZDbSAAAACXBIWXMAAAAAAAAAAQCEeRdzAAABPklEQVR4nO3TwQmAMAAEQYV8Yv/1+Ugj6scSRFhmKjhYbl/rvLbHnHOjZ/w9gG+N97nH4cFFHhwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRwncJzAcQLHCRx3AxFhBdJmYqEGAAAAAElFTkSuQmCC') repeat 0 0 / 60px 60px;
  }
  .cover img { display: block; }

  /* ⚠︎ TOUS CES MORCEAUX SONT COUPES AU RAS DE L'ENCRE, sans marge de
     fond. Une marge de fond transporterait la grille d'origine, et comme
     le morceau est repose ailleurs, cette grille ne tomberait plus sur
     celle du fond : on verrait un rectangle plus clair ou plus sombre
     autour de chaque piece. Au ras, il n'y a plus de fond a desaligner. */
  .mockup { position: absolute; left: 0;      top: 0;     width: 650px;   height: 396px;
            /* le bord droit du mockup porte le halo de son flou : coupe net,
               il laisse une marche de ton. On le fond dans le fond. */
            -webkit-mask-image: linear-gradient(to right, #000 88%, transparent 100%);
                    mask-image: linear-gradient(to right, #000 88%, transparent 100%); }
  .badge  { position: absolute; left: 32px;    top: 28px;  width: 268px;   height: 56px; }
  .puces  { position: absolute; left: 636.5px; top: 56px;  width: 789.5px; height: 43.5px; }
  .titre  { position: absolute; left: 659.5px; top: 140px; width: 736.5px; height: 94.5px; }

  /* Le bandeau de confiance, pleine largeur, pose par-dessus tout. */
  .bande {
    position: absolute; left: 0; bottom: 0; width: 1584px; height: 120px;
    background: #fff; border-top: 1px solid rgba(15, 23, 42, 0.07);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 40px 0 400px;
  }
  .bande .b-usedby    { width: 79px;   height: 20px; }
  .bande .b-chartreux { width: 72.5px; height: 49px; }
  .bande .b-iut       { width: 115px;  height: 41px; }
  .bande .b-count     { width: 235px;  height: 27px; }

  .b-faces { display: flex; gap: 8px; }
  .b-faces img {
    width: 114px; height: 76px; object-fit: cover;
    border-radius: 4px; border: 1px solid rgba(15, 23, 42, 0.11);
    filter: saturate(.92);
  }

  /* ?debug : la zone que la photo de profil recouvre. */
  body.debug .ref { position: absolute; left: 50px; bottom: 0; width: 320px; height: 130px;
    outline: 2px dashed rgba(230,57,70,.75); background: rgba(230,57,70,.10); }
  body:not(.debug) .ref { display: none; }
</style>
